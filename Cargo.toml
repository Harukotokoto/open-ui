[workspace]
members = ["src-tauri", "crates/core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Harukoto"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP。TLS は rustls(`.timeout` は付けない。→ SYSTEM-DESIGN §7.1)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"
tokio = "1"
tokio-util = "0.7"
# OS の資格情報ストア(既定の v1 機能で Windows / macOS / Secret Service を選ぶ)
keyring = "4.2.0"
tempfile = "3"
# tauri-specta が specta のバージョンを固定しているため、揃えて固定する
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

# リリースの最適化(プロファイルはワークスペースのルートでのみ有効)
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
