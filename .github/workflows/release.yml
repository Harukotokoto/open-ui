name: Release

# `vX.Y.Z` のタグを push すると、3OSのインストーラーをビルドして、GitHub Releases にドラフトを作る。
# ドラフトを公開(Publish release)すると、アプリの自動更新が見に行く `latest.json` が最新になる。
on:
  push:
    tags: ["v*"]

# 同じタグのリリースは並行させない。途中で止めると中途半端なドラフトが残るので、キャンセルもしない
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # タグ・package.json・tauri.conf.json・Cargo.toml のバージョンが食い違うと、
  # 更新が「最新版」と判定されなくなる。ビルドの前に止める
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check that the tag matches every version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          package=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag=$expected package.json=$package tauri.conf.json=$tauri Cargo.toml=$cargo"
          if [ "$package" != "$expected" ] || [ "$tauri" != "$expected" ] || [ "$cargo" != "$expected" ]; then
            echo "::error::タグ($TAG)と、package.json・tauri.conf.json・Cargo.toml のバージョンが一致しません"
            exit 1
          fi

  # ドラフトのリリースを先に1回だけ作る。ビルドのジョブが同時に作ろうとして、重複するのを防ぐ
  create-release:
    name: Create draft release
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # ドラフトは「タグから取得」のAPIでは見えないので、一覧から探す
          find_release_id() {
            gh api "repos/$GH_REPO/releases?per_page=100" \
              | jq -r --arg tag "$TAG" 'map(select(.tag_name == $tag)) | first | .id // empty'
          }
          # 再実行で、すでにドラフトがあるときは作り直さずに使う
          release_id=$(find_release_id)
          if [ -z "$release_id" ]; then
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "open-ui $TAG"
            release_id=$(find_release_id)
          fi
          if [ -z "$release_id" ]; then
            echo "::error::リリースのIDを取得できませんでした"
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # AppImage が古い glibc でも動くよう、新しすぎない Ubuntu を使う
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          # Apple Silicon と Intel を1つのアプリにまとめる
          - os: macos-latest
            args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新ファイルへの署名。アプリは、tauri.conf.json の公開鍵でこの署名を検証する
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # 同じ Windows 用に NSIS と MSI の両方ができる。更新は NSIS に統一する
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # 3OS が並行して `latest.json` を更新するので、書き込みが重なると一部のOSが抜けることがある。
  # 公開する前に、全OS分がそろっているかを確かめる(抜けていたら、失敗したジョブを再実行する)
  verify-updater-json:
    name: Verify latest.json
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check platforms in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern latest.json --output latest.json
          jq '.platforms | keys' latest.json
          missing=0
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json > /dev/null; then
              echo "::error::latest.json に $platform がありません"
              missing=1
            fi
          done
          exit $missing
